<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua conta no ChessWorld</title>
    <link rel="icon" href="img/chessworldlogo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/criarconta.css">
    <link rel="stylesheet" href="css/bootstrap/bootstrapcriarconta.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="corpocriarconta">
    <div class="container py-3">

        <img class="logocriar img-fluid" src="img/chessworldlogo.png" alt="Logo do Chess World.">
        <h1 class="titulo">Tudo sobre Xadrez em um só lugar.</h1>

        <h2 class="subtitulo">Crie sua Conta</h2>

        <div class="row justify-content-center align-items-center g-4 mt-2">

            <div class="col-12 col-md-8 col-lg-5">
                <form action="principal.html" method="get">

                    <input type="text" id="nickname" name="nickname" placeholder="Nome de usuário" required>

                    <input type="email" id="e-mail" name="email" placeholder="E-mail" required>

                    <div class="senha-wrapper">
                        <input type="password" id="senha" name="senha" placeholder="Senha" required>
                        <i class="fa-solid fa-eye toggle-senha" data-target="senha"></i>
                    </div>

                    <div class="senha-wrapper">
                        <input type="password" id="confirmarsenha" name="confirmarsenha"
                            placeholder="Confirme sua senha" required>
                        <i class="fa-solid fa-eye toggle-senha" data-target="confirmarsenha"></i>
                    </div>

                    <div class="linhatermos">
                        <label for="caixatermos" class="textocriar">
                            Li e aceito os <a href="termos.html">Termos de serviço.</a>
                        </label>
                        <input type="checkbox" id="caixatermos" name="Caixa Termos" value="sim" required>
                    </div>

                    <button class="botaocriarcontapag" type="submit"><strong>Criar
                            Conta</strong></button>

                    <p class="possuiconta">Já possui uma conta? <a href="login.html">Entrar</a></p>
                    <a class="entrarsemconta" href="index.html">Entrar sem uma conta</a>

                </form>
            </div>

            <div class="col-lg-5 d-none d-lg-block text-center">
                <img src="img/deep blue pixel GIF.gif" class="gifcriarconta img-fluid"
                    alt="Animação em pixel art do Deep Blue" loading="lazy">
            </div>

        </div>

        <p class="direitos">© 2026 Chess World. Todos os direitos reservados.</p>

    </div>

    <script>
        document.querySelectorAll('.toggle-senha').forEach(icone => {
            icone.addEventListener('click', () => {
                const inputId = icone.getAttribute('data-target');
                const input = document.getElementById(inputId);

                if (input.getAttribute('type') === 'password') {
                    input.setAttribute('type', 'text');
                    icone.classList.remove('fa-eye');
                    icone.classList.add('fa-eye-slash');
                } else {
                    input.setAttribute('type', 'password');
                    icone.classList.remove('fa-eye-slash');
                    icone.classList.add('fa-eye');
                }
            });
        });
    </script>
</body>

</html>
